<!doctype html>
<html lang="en-GB">
<head>

<style>
:root {
  --bg: #0B0C16; --raise: #151726; --raise-2: #1E2134;
  --line: rgba(236, 220, 200, .09); --line-2: rgba(236, 220, 200, .17);
  --ink: #F2EADC; --ink-2: #B9AF9F; --ink-3: #7D7568;
  --sun: #EFA65E; --sun-soft: rgba(239, 166, 94, .16); --on-sun: #1E1206;
  --dome-in: #0B0C16; --dome-out: #1B1630;
  --glow-a: #F0985A; --glow-b: #A9465C; --glow-c: #33295F;
  --serif: "Cormorant Garamond", "EB Garamond", Georgia, serif;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --deva: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", serif;
  --rs: 1;
  color-scheme: dark;
}
:root[data-theme="red"] { --bg: #0C0404; --raise: #160707; --raise-2: #1F0A0A; --line: rgba(255, 90, 70, .12); --line-2: rgba(255, 90, 70, .22);
  --ink: #E2573F; --ink-2: #A9412F; --ink-3: #74291F; --sun: #FF5B3D; --sun-soft: rgba(255, 91, 61, .18); --on-sun: #1A0503;
  --dome-in: #070202; --dome-out: #1E0808; --glow-a: #C2361F; --glow-b: #6A160D; --glow-c: #240606; }
:root[data-theme="amber"] { --bg: #0D0904; --raise: #171008; --raise-2: #20170C; --line: rgba(255, 190, 110, .10); --line-2: rgba(255, 190, 110, .20);
  --ink: #EBC48A; --ink-2: #A98A5C; --ink-3: #6F5A3B; --sun: #FFB04A; --sun-soft: rgba(255, 176, 74, .18); --on-sun: #1A0F02;
  --dome-in: #080502; --dome-out: #241809; --glow-a: #E08A2C; --glow-b: #7A4214; --glow-c: #2A1A08; }
:root[data-theme="sea"] { --bg: #06121A; --raise: #0B1C26; --raise-2: #102632; --line: rgba(150, 220, 230, .09); --line-2: rgba(150, 220, 230, .18);
  --ink: #D6E9EC; --ink-2: #8EAEB4; --ink-3: #5A7880; --sun: #6FD9D0; --sun-soft: rgba(111, 217, 208, .16); --on-sun: #031513;
  --dome-in: #030B10; --dome-out: #0F2A38; --glow-a: #3FB4B0; --glow-b: #1D5E7A; --glow-c: #0B2238; }
:root[data-theme="aurora"] { --bg: #07110D; --raise: #0C1A14; --raise-2: #11241B; --line: rgba(150, 235, 190, .09); --line-2: rgba(150, 235, 190, .18);
  --ink: #D7EBDF; --ink-2: #8DAA9A; --ink-3: #5A7566; --sun: #86E3A8; --sun-soft: rgba(134, 227, 168, .16); --on-sun: #04140B;
  --dome-in: #040A07; --dome-out: #12291E; --glow-a: #5DBE84; --glow-b: #24684A; --glow-c: #0E281C; }
:root[data-theme="dusk"] { --bg: #110D1A; --raise: #1A1426; --raise-2: #221A31; --line: rgba(210, 190, 255, .09); --line-2: rgba(210, 190, 255, .18);
  --ink: #E8E1F4; --ink-2: #A79CBD; --ink-3: #6E6485; --sun: #F2A7C8; --sun-soft: rgba(242, 167, 200, .16); --on-sun: #1E0812;
  --dome-in: #0A0712; --dome-out: #261C3A; --glow-a: #E58AB3; --glow-b: #7A3E8C; --glow-c: #2A1C46; }
:root[data-size="large"] { --rs: 1.14; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: clip; }
body.locked { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.serif { font-family: var(--serif); }

/* The sky behind everything */
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

/* Header */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 6; padding: calc(8px + env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 18px max(20px, env(safe-area-inset-left));
  display: flex; align-items: center; justify-content: space-between; background: linear-gradient(var(--bg) 35%, transparent); transition: opacity .5s; }
.brand { font: 500 25px/1 var(--serif); letter-spacing: .01em; display: flex; align-items: center; gap: 9px; }
.brand svg { width: 26px; height: 18px; color: var(--sun); }
.tools { display: flex; gap: 2px; }
.icon-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); transition: color .2s, background .2s; }
.icon-btn:active { background: var(--raise); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="true"] { color: var(--sun); }
.badge { position: absolute; top: 6px; right: 5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--sun); color: var(--on-sun);
  font: 600 10px/16px var(--sans); text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.badge[hidden] { display: none; }

/* Sections */
main { position: relative; z-index: 1; }
.wrap { width: 100%; max-width: 34rem; margin: 0 auto; padding: 0 22px; }
section.panel { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: calc(84px + env(safe-area-inset-top)) 0 64px; }
#today { justify-content: flex-start; }
.kicker { margin: 0; font: 500 13px/1.3 var(--sans); color: var(--sun); letter-spacing: .02em; }

.dayline { display: flex; align-items: center; gap: 2px; margin: 0 0 18px -12px; }
.dayline .icon-btn { width: 40px; height: 40px; }
.dayline .icon-btn svg { width: 18px; height: 18px; }
.daytxt { font: 500 14px/1 var(--sans); color: var(--ink-2); letter-spacing: .01em; padding: 0 2px; }
.today-btn { margin-left: 8px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--sun-soft); color: var(--sun); font: 600 13px/30px var(--sans); }
.today-btn[hidden] { display: none; }
.lead { margin: 0; font: 500 calc(19px * var(--rs))/1.3 var(--serif); color: var(--ink-2); }
.place { margin: 2px 0 0; font: 500 44px/1.04 var(--serif); letter-spacing: -.012em; color: var(--ink); text-wrap: balance; }
.passage { position: relative; margin: 26px 0 0; font: 500 calc(25px * var(--rs))/1.42 var(--serif); color: var(--ink); max-width: 30em; text-wrap: pretty; }
.passage::before { content: "“"; position: absolute; left: -.42em; top: -.08em; font-size: 1.5em; line-height: 1; color: var(--sun); opacity: .8; }
.passage .s { display: inline; animation: rise-in 1.1s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * .32s + .1s); }
.passage i, .reading i { font-style: italic; }
@keyframes rise-in { from { opacity: 0; filter: blur(5px); } to { opacity: 1; filter: blur(0); } }
.source { margin: 16px 0 0; font: 500 calc(17px * var(--rs))/1.4 var(--serif); color: var(--ink-2); }
.source .dot { color: var(--ink-3); padding: 0 .3em; }
.note { margin: 14px 0 0; font: 400 14px/1.45 var(--sans); color: var(--ink-3); }

.acts { display: flex; align-items: center; gap: 6px; margin-top: 22px; flex-wrap: wrap; }
.hear { display: inline-flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px 0 4px; border-radius: 26px; text-align: left; }
.hear .round { width: 48px; height: 48px; border-radius: 50%; background: var(--sun); color: var(--on-sun); display: grid; place-items: center; box-shadow: 0 6px 24px var(--sun-soft); flex: none; }
.hear .round svg { width: 20px; height: 20px; }
.hear .lbl { font: 600 15px/1.2 var(--sans); }
.hear .lbl small { display: block; font: 400 13px/1.3 var(--sans); color: var(--ink-3); }
.hear.busy .round::after { content: ""; position: absolute; }
.spacer { flex: 1; }
.text-btn { height: 44px; padding: 0 6px; font: 600 15px/44px var(--sans); color: var(--ink-2); text-decoration: underline; text-underline-offset: 5px; text-decoration-color: var(--line-2); }
.text-btn:active { color: var(--ink); }

/* Loading lines */
.ghost-lines { margin-top: 28px; display: grid; gap: 14px; }
.ghost-lines span { height: 18px; border-radius: 9px; background: linear-gradient(90deg, var(--raise) 0%, var(--raise-2) 50%, var(--raise) 100%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
.ghost-lines span:nth-child(2) { width: 88%; } .ghost-lines span:nth-child(3) { width: 64%; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* Thread of years */
.thread { margin-top: 40px; }
.thread-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.thread-head p { margin: 0; font: 500 13px/1.3 var(--sans); color: var(--ink-3); }
.chips { position: relative; display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; margin: 12px -22px 0; padding: 4px 22px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.yr { flex: none; scroll-snap-align: start; min-width: 74px; padding: 10px 12px 9px; border-radius: 16px; background: color-mix(in srgb, var(--raise) 78%, transparent); border: 1px solid var(--line); text-align: left; transition: background .25s, border-color .25s; }
.yr b { display: block; font: 600 19px/1.1 var(--serif); }
.yr span { display: block; margin-top: 3px; font: 500 13px/1.2 var(--serif); color: var(--ink-3); white-space: nowrap; max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
.yr[aria-pressed="true"] { background: var(--sun-soft); border-color: color-mix(in srgb, var(--sun) 55%, transparent); }
.yr[aria-pressed="true"] span { color: var(--ink-2); }
.cue { margin: 0 auto; padding-top: 34px; width: max-content; display: grid; justify-items: center; gap: 2px; color: var(--ink-3); font: 500 13px/1.3 var(--sans); }
.cue svg { width: 18px; height: 18px; animation: bob 2.6s ease-in-out 3; }
@keyframes bob { 50% { transform: translateY(5px); } }

/* Verse */
.vref { margin: 6px 0 0; font: 500 36px/1.08 var(--serif); letter-spacing: -.01em; }
.verse-lines { margin: 26px 0 0; text-align: center; }
.deva { margin: 0; font: 400 calc(20px * var(--rs))/1.75 var(--deva); color: var(--ink-2); }
.roman { margin: 14px 0 0; font: 500 calc(19px * var(--rs))/1.5 var(--serif); color: var(--ink-2); }
.rule { width: 42px; height: 1px; background: var(--line-2); margin: 26px auto; border: 0; }
.translation { margin: 0; font: 600 calc(24px * var(--rs))/1.4 var(--serif); color: var(--ink); text-wrap: pretty; }
.purport { margin: 18px 0 0; font: 500 calc(19.5px * var(--rs))/1.55 var(--serif); color: var(--ink-2); text-wrap: pretty; }

/* Open the book */
.book-stage { display: grid; justify-items: center; margin-top: 30px; }
.book { position: relative; width: 132px; height: 176px; perspective: 900px; }
.book-btn { display: grid; justify-items: center; gap: 18px; padding: 10px 26px 4px; border-radius: 24px; }
.book-btn:active .book { transform: scale(.97); }
.book .pages, .book .cover, .book .leaf { position: absolute; inset: 0; border-radius: 4px 12px 12px 4px; }
.book .pages { background: linear-gradient(90deg, #cdbf9f 0, #efe4cc 6%, #e6d9bd 100%); box-shadow: 0 18px 40px rgba(0, 0, 0, .5), 0 0 60px var(--sun-soft); transform: translate(6px, 4px); }
.book .leaf { background: linear-gradient(90deg, #d9cbac, #f3e9d3); transform-origin: left center; transform: rotateY(0); }
.book .cover { background: radial-gradient(120% 90% at 30% 20%, var(--raise-2), var(--raise)); border: 1px solid var(--line-2); transform-origin: left center; transform: rotateY(0); display: grid; place-items: center; backface-visibility: hidden; }
.book .cover::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
.book .cover svg { width: 64px; height: 44px; color: var(--sun); opacity: .9; }
.book.opening .cover { animation: open-cover 1.05s cubic-bezier(.5, 0, .2, 1) forwards; }
.book.opening .leaf { animation: flip 0.9s cubic-bezier(.4, 0, .2, 1) forwards; animation-delay: calc(.25s + var(--n) * .11s); }
@keyframes open-cover { to { transform: rotateY(-168deg); } }
@keyframes flip { to { transform: rotateY(-160deg); opacity: .0; } }
.book-hint { font: 500 14px/1.3 var(--sans); color: var(--ink-3); }
.opened { margin-top: 8px; }
.opened .reveal > * { animation: rise-in 1s cubic-bezier(.2, .7, .2, 1) both; }
.opened .reveal > :nth-child(2) { animation-delay: .15s; } .opened .reveal > :nth-child(3) { animation-delay: .3s; } .opened .reveal > :nth-child(4) { animation-delay: .45s; } .opened .reveal > :nth-child(5) { animation-delay: .6s; }
.again { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px 0 6px; border-radius: 24px; background: var(--raise); border: 1px solid var(--line); font: 600 15px/1 var(--sans); }
.again .mini-book { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--sun-soft); color: var(--sun); }
.again .mini-book svg { width: 18px; height: 18px; }

/* Side dots */
.dots { position: fixed; right: max(0px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); z-index: 5; display: grid; gap: 0; }
.dots button { width: 24px; height: 34px; display: grid; place-items: center; }
.dots i { display: block; width: 5px; height: 5px; border-radius: 3px; background: var(--ink-3); opacity: .55; transition: height .35s, background .35s, opacity .35s; }
.dots button[aria-current="true"] i { height: 16px; background: var(--sun); opacity: 1; }

/* Footer */
.foot { position: relative; z-index: 1; padding: 10px 0 calc(110px + env(safe-area-inset-bottom)); font: 500 15px/1.5 var(--serif); color: var(--ink-3); }
.foot a { color: var(--ink-2); text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.foot p { margin: 0 0 8px; }

/* Notices */
.notice { display: flex; gap: 10px; align-items: center; margin: 22px 0 0; padding: 10px 8px 10px 14px; border-radius: 16px; background: color-mix(in srgb, var(--raise) 86%, transparent); font-size: 14px; color: var(--ink-2); }
.notice p { margin: 0; flex: 1; }
.notice .link { color: var(--sun); font-weight: 600; white-space: nowrap; padding: 8px 4px; }
.notice .x { color: var(--ink-3); width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; }
.notice .x svg { width: 16px; height: 16px; }

/* Buttons */
.btn { height: 48px; padding: 0 22px; border-radius: 24px; background: var(--raise-2); font: 600 15px/1 var(--sans); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--sun); color: var(--on-sun); }
.btn:disabled { opacity: .55; }
.round-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.round-btn svg { width: 21px; height: 21px; }
.round-btn:active { background: var(--raise); }
.round-btn[aria-pressed="true"] { color: var(--sun); }

/* Spinner: a comet */
.spinner, .busy::after { border-radius: 50%; background: conic-gradient(from 90deg, transparent 10%, currentColor 95%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.2px), #000 calc(100% - 2px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 2.2px), #000 calc(100% - 2px)); animation: spin .8s linear infinite; }
.spinner { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; }
.busy { position: relative; pointer-events: none; }
.busy > * { visibility: hidden; }
.busy::after { content: ""; position: absolute; width: 18px; height: 18px; left: calc(50% - 9px); top: calc(50% - 9px); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Audio dock */
.dock { position: fixed; z-index: 7; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); width: min(calc(100% - 20px), 33rem); transform: translate(-50%, 0);
  border-radius: 30px; background: color-mix(in srgb, var(--raise) 88%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
  border: 1px solid var(--line-2); box-shadow: 0 18px 50px rgba(0, 0, 0, .5); padding: 8px 8px 8px 8px; display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 4px;
  transition: transform .45s cubic-bezier(.2, .8, .2, 1), opacity .3s; }
.dock[hidden] { display: grid; transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
.dock .pp { width: 46px; height: 46px; border-radius: 50%; background: var(--sun); color: var(--on-sun); display: grid; place-items: center; }
.dock .pp svg { width: 19px; height: 19px; }
.dock .info { min-width: 0; padding: 0 6px 0 8px; cursor: pointer; }
.dock .t1 { font: 600 16px/1.2 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .t2 { font: 400 12.5px/1.3 var(--sans); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .speed { min-width: 44px; height: 44px; border-radius: 22px; font: 600 13px/44px var(--sans); color: var(--ink-2); }
.dock .seek { grid-column: 1 / -1; order: 9; margin: 2px 10px 2px; }
.seek { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; }
.seek::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--sun) var(--p, 0%), var(--line-2) var(--p, 0%)); }
.seek::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line-2); }
.seek::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--sun); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--sun-soft); }
.seek::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink); }

/* Reader */
.reader { position: fixed; inset: 0; z-index: 9; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  transition: transform .4s cubic-bezier(.2, .8, .2, 1), opacity .3s; }
.reader[hidden] { display: block; transform: translateY(24px); opacity: 0; pointer-events: none; visibility: hidden; }
.r-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 2px; padding: calc(6px + env(safe-area-inset-top)) 10px 10px; background: linear-gradient(var(--bg) 70%, transparent); }
.r-bar .spacer { flex: 1; }
.reading { max-width: 34rem; margin: 0 auto; padding: 4px 24px calc(140px + env(safe-area-inset-bottom)); }
.reading h1 { margin: 6px 0 0; font: 500 36px/1.1 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
.reading .sub { margin: 8px 0 26px; font: 500 18px/1.4 var(--serif); color: var(--ink-2); }
.reading p { margin: 0 0 16px; font: 500 calc(20px * var(--rs))/1.58 var(--serif); color: var(--ink); text-wrap: pretty; }
.reading p.other { color: var(--ink-2); }
.reading .who { margin: 26px 0 6px; font: 600 15.5px/1.2 var(--serif); color: var(--ink-3); letter-spacing: .01em; }
.reading .who.him { color: var(--sun); }
.reading .vq { margin: 6px 0 18px; text-align: center; font: 500 calc(18.5px * var(--rs))/1.55 var(--serif); color: var(--ink-2); }
.reading .vq.deva { font-family: var(--deva); font-size: calc(19px * var(--rs)); }
.reading h2 { margin: 34px 0 12px; font: 600 22px/1.2 var(--serif); }
.reading h3 { margin: 26px 0 10px; font: 600 19px/1.2 var(--serif); color: var(--ink-2); }
.reading .ref { color: var(--ink-3); font-size: .82em; white-space: nowrap; }
.reading .syn { font-size: calc(16.5px * var(--rs)); color: var(--ink-2); }
.reading .tr { font-weight: 600; font-size: calc(22px * var(--rs)); }
.reading .mark { position: relative; margin-left: -14px; margin-right: -14px; padding: 12px 14px; border-radius: 14px; background: var(--sun-soft); }
.reading .mark::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--sun); }

/* Sheets */
dialog.sheet { position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 34rem; max-height: 86vh; border: 0; border-radius: 24px 24px 0 0; padding: 0;
  background: var(--raise); color: var(--ink); overflow: auto; overscroll-behavior: contain; }

@keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } }

.sheet .small { font-size: 13.5px; color: var(--ink-3); }
.sheet .serif-p { font: 500 17px/1.5 var(--serif); color: var(--ink-2); }
.list { margin: 0; padding: 0; list-style: none; }
.list li { border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 10px 0; text-align: left; }
.row .main { flex: 1; min-width: 0; }
.row .t { display: block; font: 600 17px/1.3 var(--serif); }

.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-2); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: var(--sun); }

/* Theme panel */
.pop { position: fixed; top: calc(58px + env(safe-area-inset-top)); right: 12px; z-index: 8; width: min(300px, calc(100% - 24px)); padding: 16px 12px 12px; border-radius: 20px;
  background: var(--raise); border: 1px solid var(--line-2); box-shadow: 0 18px 40px rgba(0, 0, 0, .5); animation: drop .18s ease-out; transform-origin: top right; }

/* Welcome */
.welcome { position: fixed; inset: 0; z-index: 12; overflow-y: auto; display: grid; place-items: center; background: radial-gradient(120% 70% at 50% 110%, color-mix(in srgb, var(--glow-a) 30%, transparent), transparent 60%), var(--bg);
  padding: calc(30px + env(safe-area-inset-top)) 26px calc(30px + env(safe-area-inset-bottom)); transition: opacity .9s ease, visibility .9s; }

@keyframes draw { to { stroke-dashoffset: 0; } }

.code::placeholder { color: var(--ink-3); letter-spacing: .35em; }

@keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }

/* Toast, above sheets */
.toast { position: fixed; inset: auto auto calc(92px + env(safe-area-inset-bottom)) 50%; margin: 0; border: 0; width: max-content; max-width: calc(100% - 40px); transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 22px; font: 500 14px/1.35 var(--sans); text-align: center; transition: opacity .25s, transform .25s; z-index: 20; }

<script src="core.js?v=1"></script>
<script>
(() => {
'use strict';
const V = window.Vani;
const REL = 1;
const CODE_HASH = 'ec6a77880098871a7772fa0975e809908e02a7fd0b8117986098c7dab7a4827f';   // sha-256 of "vani:" + the shared code
const TEXT_CACHE = 'vani-texts';

/* ---------- Platform and storage ---------- */
const UA = navigator.userAgent;
const isIOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(UA);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const P = 'vni.';
const get = (k, d) => { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch {} };

const S = {
  set: Object.assign({ theme: 'dawn', sound: true, chimes: true, size: 'normal', speed: 1 }, get('settings', {})),
  unlocked: get('unlocked', false),
  welcomed: get('welcomed', false),
  kept: get('kept', []),
  index: null, books: null,
  date: noon(new Date()),
  day: null, feat: null, featState: 'loading', featTry: 0,
  verse: null, verseState: 'loading',
  opened: null, openState: 'closed',
  installEvt: null,
  player: { item: null, doc: null, ex: null, wantJump: false },
  section: 'today',
};
const saveSet = () => put('settings', S.set);
function noon(d) { const x = new Date(d); x.setHours(12, 0, 0, 0); return x; }
const isToday = () => V.ymd(S.date) === V.ymd(new Date());

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WEEK = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const I = (d, fill) => `<svg viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  wave: I('<path d="M3 12h2.5l2-5 3 11 3-14 3 11 2-3H21"/>'),
  waveOff: I('<path d="M3 12h2.5l2-5 3 11 3-14 3 11 2-3H21" opacity=".45"/><path d="M4 4l16 16"/>'),
  bookmark: I('<path d="M7 3.8h10v16.4l-5-3.6-5 3.6Z"/>'),
  bookmarkOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.8h10v16.4l-5-3.6-5 3.6Z"/></svg>',
  eye: I('<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>'),
  sliders: I('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),
  left: I('<path d="M14.5 6 8.5 12l6 6"/>'),
  right: I('<path d="M9.5 6l6 6-6 6"/>'),
  down: I('<path d="M6 9.5l6 6 6-6"/>'),
  back: I('<path d="M19 12H5.5M11 6l-6 6 6 6"/>'),
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.6-6.8c.6-.4.6-1.3 0-1.7L9.6 4.3C8.9 3.9 8 4.4 8 5.2Z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  share: I('<path d="M12 3.5v11M7.5 8 12 3.5 16.5 8M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/>'),
  read: I('<path d="M3 5.5c3-1 6-.8 9 1.2 3-2 6-2.2 9-1.2v13c-3-1-6-.8-9 1.2-3-2-6-2.2-9-1.2Z"/><path d="M12 6.7v13"/>'),
  x: I('<path d="M6 6l12 12M18 6 6 18"/>'),
  near: I('<circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>'),
  again: I('<path d="M4 7.5c2.6-.9 5.3-.7 8 1 2.7-1.7 5.4-1.9 8-1v11c-2.6-.9-5.3-.7-8 1-2.7-1.7-5.4-1.9-8-1Z"/><path d="M12 8.5v11"/>'),
};
const LOTUS = (cls, stroke) => `<svg class="${cls}" viewBox="0 0 120 80" fill="none" stroke="currentColor" stroke-width="${stroke || 1.4}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path pathLength="1" style="--d:0" d="M60 6C72 24 72 44 60 60 48 44 48 24 60 6Z"/>
  <path pathLength="1" style="--d:1" d="M60 60C44 52 36 34 38 16 52 24 58 40 60 60Z"/>
  <path pathLength="1" style="--d:1" d="M60 60C76 52 84 34 82 16 68 24 62 40 60 60Z"/>
  <path pathLength="1" style="--d:2" d="M60 62C38 62 20 50 10 32 30 30 48 42 60 62Z"/>
  <path pathLength="1" style="--d:2" d="M60 62C82 62 100 50 110 32 90 30 72 42 60 62Z"/>
  <path pathLength="1" style="--d:3" d="M28 69C46 75 74 75 92 69"/>
  <path pathLength="1" style="--d:4" d="M44 75.5C54 77.5 66 77.5 76 75.5"/></svg>`;

let toastTimer;
function toast(msg, busy) {
  const t = $('#toast');
  t.innerHTML = (busy ? '<span class="spinner" aria-hidden="true"></span>' : '') + esc(msg);
  try { if (t.matches(':popover-open')) t.hidePopover(); t.showPopover(); } catch {}
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (!busy) toastTimer = setTimeout(() => { t.classList.remove('show'); setTimeout(() => { try { t.hidePopover(); } catch {} }, 300); }, Math.max(2600, msg.length * 55));
}

/* ---------- Reading the archive ---------- */
const mem = new Map();
async function fetchTimed(url, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, { signal: ctl.signal }); } finally { clearTimeout(timer); }
}
// Texts are kept on the phone once read, so they open offline next time
async function getText(id) {
  if (mem.has(id)) return mem.get(id);
  const [primary, mirror] = V.urls(id);
  let cache = null;
  try { cache = await caches.open(TEXT_CACHE); const hit = await cache.match(primary); if (hit) { const t = await hit.text(); mem.set(id, t); return t; } } catch {}
  for (const u of [primary, mirror]) {
    try {
      const r = await fetchTimed(u, 9000);
      if (!r.ok) continue;
      const t = await r.text();
      if (!t || t.length < 40) continue;
      mem.set(id, t);
      try { if (cache) await cache.put(primary, new Response(t, { headers: { 'Content-Type': 'text/plain; charset=utf-8' } })); } catch {}
      return t;
    } catch {}
  }
  throw new Error('unreachable');
}
const getDoc = async (id) => V.parse(await getText(id));

async function loadIndex() {
  const [a, b] = await Promise.all([fetch('index.json').then((r) => r.json()), fetch('books.json').then((r) => r.json())]);
  S.index = a; S.books = V.decodeBooks(b);
}

/* ---------- On this day ---------- */
function setDay() {
  S.day = V.dayItems(S.index, V.mmdd(S.date));
}

// Find the day's words: the first item in the day's order with a good passage
async function chooseFeatured(year, item) {
  const ticket = ++S.featTry;
  const ds = V.ymd(S.date);
  const order = item ? [item] : year ? V.bestOfYear(S.day.items, ds, year) : V.featuredOrder(S.day.items, ds);
  if (!order.length && year) order.push(...S.day.items.filter((i) => i.year === year));
  S.featState = 'loading';
  S.feat = order[0] ? { it: order[0], ex: null } : null;   // the year and place show while the words arrive
  renderToday();
  let best = null, reached = false;
  for (const it of order.slice(0, item ? 1 : 6)) {
    let doc;
    try { doc = await getDoc(it.id); reached = true; } catch { continue; }
    if (ticket !== S.featTry) return;
    const ex = V.extract(doc, it.kind) || firstWords(doc, it.kind);
    if (ex && (!best || ex.score > best.ex.score)) best = { it, doc, ex };
    if (ex && ex.ok) break;
  }
  if (ticket !== S.featTry) return;
  if (best) {
    S.feat = best; S.featState = 'ready';
    if (isToday() && !year && !item) put('last', { it: best.it, raw: best.ex.raw, text: best.ex.text, block: best.ex.block, at: Date.now() });
  } else {
    S.feat = null; S.featState = reached ? 'empty' : 'offline';
  }
  renderToday();
}
// When nothing scores well, the first real paragraph still says something true
function firstWords(doc, kind) {
  for (let i = 0; i < doc.blocks.length; i++) {
    const b = doc.blocks[i];
    if (b.t !== 'p' || (kind === 'spoken' && !/prabhup/i.test(b.who))) continue;
    const sents = V.sentences(V.stripRefs(b.raw));
    let raw = '';
    for (const s of sents) { if (V.plain(raw + ' ' + s).length > 380 && raw) break; raw = raw ? raw + ' ' + s : s; }
    const text = V.plain(raw);
    if (text.length > 60) return { raw, text, block: i, pos: 0, total: 1, score: -99, ok: false };
  }
  return null;
}

function leadFor(it) { return `On this day in ${it.year}`; }
function bigWord(it) { return it.kind === 'letters' ? `To ${it.to}` : (it.place || it.title); }
function sourceLine(it) {
  if (it.kind === 'letters') return `<span>A letter</span><span class="dot">·</span><span class="num">${esc(V.longDate(it.id))}</span>`;
  return `<span>${esc(it.title)}</span>${it.mins ? `<span class="dot">·</span><span class="num">${it.mins} min</span>` : ''}`;
}
function passageHtml(raw) {
  const s = V.sentences(raw);
  return s.map((x, i) => `<span class="s" style="--i:${i}">${V.inline(x)}</span>`).join(' ');
}
const keyFor = (id, block) => (block == null ? id : `${id}#${block}`);
const isKept = (k) => S.kept.some((x) => x.k === k);

function dayLine() {
  const label = isToday() ? `Today, ${WEEK.format(S.date)}` : WEEK.format(S.date);
  return `<div class="dayline">

    <button class="today-btn" type="button" data-act="to-today" ${isToday() ? 'hidden' : ''}>Today</button>
  </div>`;
}

function threadHtml() {
  const yrs = S.day ? S.day.years : [];
  if (!yrs.length) return '';
  const cur = S.feat && S.feat.it.year;
  const chips = yrs.map((y) => `<button class="yr" type="button" data-year="${y.year}" aria-pressed="${y.year === cur}">
      <b class="num">${y.year}</b><span>${esc(y.place || (y.items.every((i) => i.kind === 'letters') ? 'Letters' : '')) || '&nbsp;'}</span></button>`).join('');
  const n = S.day.items.length;
  return `<div class="thread">
    <div class="thread-head"><p>Where he was on this day</p><button class="text-btn" type="button" data-act="day-list">All ${n}</button></div>
    <div class="chips" role="group" aria-label="Years">${chips}</div></div>`;
}

function renderToday() {
  const el = $('#todayIn');
  if (!S.index) { el.innerHTML = dayLine() + `<div class="ghost-lines" aria-hidden="true"><span></span><span></span><span></span></div>`; return; }
  const f = S.feat, st = S.featState;
  let body;
  if (st === 'loading') {
    // the year and place are known before the words arrive
    const it = f && f.it;
    body = `<p class="lead">${it ? esc(leadFor(it)) : 'On this day'}</p>
      <h1 class="place">${it ? esc(bigWord(it)) : '&nbsp;'}</h1>
      <div class="ghost-lines" aria-label="Finding today's words" role="status"><span></span><span></span><span></span></div>`;
  } else if (st === 'ready') {
    const it = f.it, k = keyFor(it.id, f.ex.block), kept = isKept(k);
    const hear = it.kind === 'spoken' && it.audio
      ? `<button class="hear" type="button" data-act="hear"><span class="round">${S.player.item && S.player.item.id === it.id && !voice.paused ? ICON.pause : ICON.play}</span>
          <span class="lbl">Hear him</span></button>` : '';
    body = `<p class="lead">${esc(leadFor(it))}</p>
      <h1 class="place">${esc(bigWord(it))}</h1>
      <blockquote class="passage" id="passage" lang="en">${passageHtml(f.ex.raw)}</blockquote>
      <p class="source">${sourceLine(it)}</p>
      ${S.offlineNote ? `<p class="note">${esc(S.offlineNote)}</p>` : ''}
      <div class="acts">${hear}<button class="text-btn" type="button" data-act="read-feat">Read in full</button><span class="spacer"></span>
        <button class="round-btn" type="button" data-act="keep-feat" aria-pressed="${kept}" aria-label="${kept ? 'Kept. Tap to remove' : 'Keep this passage'}">${kept ? ICON.bookmarkOn : ICON.bookmark}</button>
        <button class="round-btn" type="button" data-act="share-feat" aria-label="Share this passage">${ICON.share}</button></div>`;
  } else if (st === 'offline') {
    const last = get('last', null);
    body = `<p class="lead">On this day</p><h1 class="place">The archive is out of reach</h1>
      <p class="source">Vani reads his words live, and this phone can't reach them just now. Check your connection, then try again.</p>
      <div class="acts"><button class="btn primary" type="button" data-act="retry">Try again</button>${last ? '<button class="btn" type="button" data-act="last">Show my last one</button>' : ''}</div>`;
  } else {
    body = `<p class="lead">On this day</p><h1 class="place">A quiet day in the archive</h1>
      <p class="source">Nothing for this date could be read just now. Try the day before or after.</p>`;
  }
  const notice = !standalone && !get('dismissed', {}).install && S.welcomed && (S.installEvt || isIOS)
    ? `<div class="notice"><p>${S.installEvt ? 'Install Vani to open it from your app drawer.' : 'Keep Vani on your Home Screen: tap Share, then Add to Home Screen.'}</p>
        ${S.installEvt ? '<button class="link" type="button" data-act="install">Install</button>' : ''}<button class="x" type="button" data-dismiss="install" aria-label="Dismiss">${ICON.x}</button></div>` : '';
  el.innerHTML = dayLine() + body + threadHtml() + notice
    + `<button class="cue" type="button" data-go="verse"><span>Today's verse</span>${ICON.down}</button>`;
  // bring the chosen year into view within its row only (never scroll the page itself)
  const ch = $('.yr[aria-pressed="true"]', el), row = $('.chips', el);
  if (ch && row) row.scrollLeft = Math.max(0, ch.offsetLeft - (row.clientWidth - ch.offsetWidth) / 2);
}

/* ---------- Today's verse ---------- */
async function loadVerse() {
  S.verseState = 'loading'; renderVerse();
  const id = V.verseOfDay(S.books.bg, S.date);
  try {
    const doc = await getDoc(id);
    S.verse = { id, doc, v: V.verse(doc) }; S.verseState = 'ready';
  } catch { S.verseState = 'offline'; }
  renderVerse();
}
function verseBody(id, v, opts) {
  const ref = V.bookRef(id, v.title);
  const start = V.purportStart(v, 300);
  const k = keyFor(id), kept = isKept(k);
  return `<h2 class="vref">${esc(ref.name)} <span class="num">${esc(ref.ref)}</span></h2>
    ${v.deva.length || v.roman.length ? `<div class="verse-lines">${v.deva.length ? `<p class="deva" lang="sa">${v.deva.map(esc).join('<br>')}</p>` : ''}
      ${v.roman.length ? `<p class="roman" lang="sa-Latn">${v.roman.map((l) => V.inline(l, true)).join('<br>')}</p>` : ''}</div><hr class="rule">` : '<div style="height:22px"></div>'}
    <p class="translation">${V.inline(v.translation)}</p>
    ${start ? `<p class="purport">${V.inline(start)}</p>` : ''}
    <div class="acts">${v.purport.length ? `<button class="text-btn" type="button" data-read="${esc(id)}">${opts && opts.word ? opts.word : 'Read the purport'}</button>` : ''}<span class="spacer"></span>
      <button class="round-btn" type="button" data-keep-verse="${esc(id)}" aria-pressed="${kept}" aria-label="${kept ? 'Kept. Tap to remove' : 'Keep this verse'}">${kept ? ICON.bookmarkOn : ICON.bookmark}</button>
      <button class="round-btn" type="button" data-share-verse="${esc(id)}" aria-label="Share this verse">${ICON.share}</button></div>`;
}
function renderVerse() {
  const el = $('#verseIn');
  const head = `<p class="kicker">${isToday() ? 'Today’s verse' : 'The verse for this day'}</p>`;
  if (S.verseState === 'ready') el.innerHTML = head + verseBody(S.verse.id, S.verse.v);
  else if (S.verseState === 'offline') el.innerHTML = head + `<h2 class="vref">Bhagavad-gītā</h2><p class="purport">The verse couldn’t be reached. It will be here when you’re back online.</p>
    <div class="acts"><button class="btn" type="button" data-act="retry-verse">Try again</button></div>`;
  else el.innerHTML = head + `<h2 class="vref">Bhagavad-gītā</h2><div class="ghost-lines" aria-hidden="true"><span></span><span></span><span></span></div>`;
}

/* ---------- Open the book ---------- */
function bookArt(opening) {
  return `<div class="book${opening ? ' opening' : ''}" aria-hidden="true"><div class="pages"></div>
    <div class="leaf" style="--n:2"></div><div class="leaf" style="--n:1"></div><div class="leaf" style="--n:0"></div>
    <div class="cover">${LOTUS('', 4)}</div></div>`;
}
function renderBook(opening) {
  const el = $('#bookIn');
  const head = `<p class="kicker">Open the book</p>`;
  if (S.openState === 'ready' && S.opened) {
    el.innerHTML = head + `<div class="opened"><div class="reveal">${verseBody(S.opened.id, S.opened.v, { word: 'Read the page' })}</div>
      <div class="acts" style="margin-top:26px"><button class="again" type="button" data-act="open-book"><span class="mini-book">${ICON.again}</span>Open another page</button></div></div>`;
    return;
  }
  el.innerHTML = head + `<h2 class="vref">Let a page find you</h2>
    <p class="purport">Open his books at any page: the Gita, the Bhāgavatam or the Caitanya-caritāmṛta.</p>
    <div class="book-stage"><button class="book-btn${S.openState === 'loading' && !opening ? ' busy' : ''}" type="button" data-act="open-book" aria-label="Open the book at any page">
      ${bookArt(opening)}<span class="book-hint">${S.openState === 'offline' ? 'Couldn’t reach the book. Touch to try again.' : 'Touch to open'}</span></button></div>`;
}
async function openBook() {
  if (S.openState === 'loading') return;
  const first = S.openState !== 'ready';
  S.openState = 'loading';
  chime('paper');
  if (first) renderBook(true);
  else { const b = $('#bookIn .again'); if (b) b.classList.add('busy'); }
  const id = V.randomVerse(S.books);
  const [doc] = await Promise.all([getDoc(id).catch(() => null), sleep(first && !reduced.matches ? 1250 : 150)]);
  if (!doc) { S.openState = 'offline'; renderBook(); return; }
  S.opened = { id, doc, v: V.verse(doc) };
  S.openState = 'ready';
  renderBook();
  if (!first) $('#book').scrollIntoView({ block: 'start' });
}

/* ---------- Reader ---------- */
let readerFor = null;
async function openReader(id, block, kind) {
  readerFor = { id, block };
  const r = $('#reader'), body = $('#reading');
  const k = V.kindOf(id);
  body.innerHTML = `<div class="ghost-lines" style="margin-top:20px" aria-label="Opening" role="status"><span></span><span></span><span></span></div>`;
  $('#rBar').innerHTML = barHtml(id, null);
  r.hidden = false;
  r.scrollTop = 0;
  pushLayer('reader', closeReader);
  let doc;
  try { doc = await getDoc(id); } catch {
    body.innerHTML = `<h1 id="rTitle">Out of reach</h1><p class="sub">This text couldn’t be reached. Check your connection and try again.</p>`; return;
  }
  if (!readerFor || readerFor.id !== id) return;
  body.innerHTML = readerHtml(id, k, doc, block);
  $('#rBar').innerHTML = barHtml(id, doc);
  // open at the passage; again once the fonts have settled the lines
  const toMark = () => { const m = $('.mark', body); if (m && readerFor && readerFor.id === id) r.scrollTop = Math.max(0, m.getBoundingClientRect().top + r.scrollTop - 110); };
  requestAnimationFrame(toMark);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(toMark));
}
function infoFor(id) {
  const k = V.kindOf(id);
  if (k === 'books') return null;
  const day = S.index && S.index.days[id.slice(2, 6)];
  if (!day) return null;
  if (k === 'spoken') { const row = day.s.find((r) => r[0] === id); return row ? V.spokenInfo(row, S.index) : null; }
  const row = day.l.find((r) => r[0] === id); return row ? V.letterInfo(row) : null;
}
function barHtml(id, doc) {
  const it = infoFor(id);
  const play = it && it.kind === 'spoken' && it.audio ? `<button class="round-btn" type="button" data-act="hear-reader" aria-label="Hear this recording">${S.player.item && S.player.item.id === id && !voice.paused ? ICON.pause : ICON.play}</button>` : '';
  return `<button class="round-btn" type="button" data-act="close-reader" aria-label="Back">${ICON.back}</button><span class="spacer"></span>${play}
    <button class="round-btn" type="button" data-act="share-reader" aria-label="Share">${ICON.share}</button>`;
}
function readerHtml(id, kind, doc, block) {
  const it = infoFor(id);
  let title, sub;
  if (kind === 'books') { const v = V.verse(doc); const ref = V.bookRef(id, v.title); title = `${ref.name} ${ref.ref}`; sub = v.title; }
  else if (kind === 'letters') { title = it ? it.title : (doc.meta.title || 'Letter'); sub = V.longDate(id); }
  else { title = it ? it.title : (doc.meta.Title_hidden || 'Recording'); sub = `${it && it.place ? it.place + ', ' : ''}${V.longDate(id)}`; }
  let html = `<p class="kicker">${kind === 'books' ? 'From his books' : kind === 'letters' ? 'A letter' : 'His words, spoken'}</p>
    <h1 id="rTitle">${esc(title)}</h1><p class="sub">${esc(sub)}</p>`;
  let firstP = true, sec = '';
  doc.blocks.forEach((b, i) => {
    if (b.t === 'h') { if (b.level === 1) return; sec = b.text; if (kind === 'books' && /^text$/i.test(b.text)) return; html += `<h${b.level === 2 ? 2 : 3}>${esc(b.text)}</h${b.level === 2 ? 2 : 3}>`; return; }
    if (b.t === 'who') { const him = /prabhup/i.test(b.who); html += `<p class="who${him ? ' him' : ''}">${esc(b.who)}</p>`; return; }
    if (b.t === 'time') { html += `<button class="tm num" type="button" data-seek="${b.s}" aria-label="Play from ${V.mmss(b.s)}">${V.mmss(b.s)}</button>`; return; }
    if (b.t === 'verse') { const deva = /[ऀ-৿]/.test(b.lines.join('')); html += `<p class="vq${deva ? ' deva' : ''}">${b.lines.map((l) => deva ? esc(l) : V.inline(l, true)).join('<br>')}</p>`; return; }
    if (b.t !== 'p') return;
    const cls = [];
    if (i === block) cls.push('mark');
    if (kind === 'spoken' && b.who && !/prabhup/i.test(b.who)) cls.push('other');
    if (kind === 'books' && /^synonyms/i.test(b.sec)) cls.push('syn');
    if (kind === 'books' && /^translation/i.test(b.sec)) cls.push('tr');
    if (kind === 'letters' && firstP && V.plain(b.raw).length < 40 && !/dear/i.test(b.raw)) cls.push('place-line');
    firstP = false;
    html += `<p${cls.length ? ` class="${cls.join(' ')}"` : ''}>${V.inline(b.raw)}</p>`;
  });
  html += `<div class="r-foot"><p>Read live from the vani.wiki archive. <a href="${esc(V.pageUrl(id))}" target="_blank" rel="noopener">See the file</a></p></div>`;
  return html;
}
function closeReader() {
  const r = $('#reader');
  r.hidden = true; r.style.transform = '';
  readerFor = null;
}

/* ---------- Layers and Back ---------- */
const layers = [];
function pushLayer(name, close) {
  layers.push({ name, close });
  history.pushState({ vani: name, n: layers.length }, '');
}
let afterPop = null;
function popLayer(name, then) {   // closing from a button: let Back do it, so history stays in step
  if (layers.length && layers[layers.length - 1].name === name) { afterPop = then || null; history.back(); }
  else if (then) then();
}
window.addEventListener('popstate', () => {
  const top = layers.pop();
  if (top) top.close();
  const f = afterPop; afterPop = null;
  if (f) setTimeout(f, 30);
});

/* ---------- Sheets ---------- */
const sheet = $('#sheet');
function openSheet(name, html) {

}
const closeSheet = (then) => popLayer('sheet', then);
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
sheet.addEventListener('cancel', (e) => { e.preventDefault(); closeSheet(); });
const head = (title) => `<div class="sheet-head" data-drag="sheet"><h2 id="sheetTitle">${title}</h2><button class="round-btn" type="button" data-act="close-sheet" aria-label="Close">${ICON.x}</button></div>`;

function openDayList() {

    `<li><button class="row" type="button" data-item="${esc(it.id)}" aria-current="${it.id === cur}"><span class="main"><span class="t">${esc(it.title)}</span>

  openSheet('day', head(esc(WEEK.format(S.date).replace(/^\w+ /, ''))) + `<p class="small">Everything in the archive from this date, across the years.</p>` + html);

function openKept() {

      <span class="kept-text">${esc(x.text)}</span><span class="s">${esc(x.title)}${x.sub ? ' · ' + esc(x.sub) : ''}</span></button>

}

/* ---------- Themes ---------- */
const THEMES = [
  { id: 'dawn', name: 'Dawn', bg: '#0B0C16', accent: '#EFA65E', glow: '#A9465C' },
  { id: 'red', name: 'Night red', bg: '#0C0404', accent: '#FF5B3D', glow: '#6A160D' },
  { id: 'amber', name: 'Amber', bg: '#0D0904', accent: '#FFB04A', glow: '#7A4214' },
  { id: 'sea', name: 'Yamunā', bg: '#06121A', accent: '#6FD9D0', glow: '#1D5E7A' },

  { id: 'dusk', name: 'Dusk', bg: '#110D1A', accent: '#F2A7C8', glow: '#7A3E8C' },
];
function themeGridHtml() {

function setTheme(id) {

}
const POPS = { themes: '#themeBtn' };
function togglePop(id, open) {
  const pop = $('#' + id), show = open == null ? pop.hidden : open;
  if (show) pop.innerHTML = themeGridHtml();

}
const popOpen = () => Object.keys(POPS).some((id) => !$('#' + id).hidden);
const closePops = () => Object.keys(POPS).forEach((id) => { if (!$('#' + id).hidden) togglePop(id, false); });
document.addEventListener('click', (e) => {

/* ---------- Keep and share ---------- */
function toggleKeep(entry, btn) {
  const i = S.kept.findIndex((x) => x.k === entry.k);
  if (i >= 0) { S.kept.splice(i, 1); toast('Removed from Kept'); }
  else { S.kept.push(Object.assign({ at: Date.now() }, entry)); toast('Kept. Find it under the bookmark at the top.'); chime('bell'); }
  put('kept', S.kept);
  if (btn) { const on = i < 0; btn.setAttribute('aria-pressed', String(on)); btn.innerHTML = on ? ICON.bookmarkOn : ICON.bookmark; btn.setAttribute('aria-label', on ? 'Kept. Tap to remove' : 'Keep this'); }
  updateBadge();
}
function updateBadge() {
  const n = S.kept.length;
  $('#keptBtn').innerHTML = ICON.bookmark + `<span class="badge num" ${n ? '' : 'hidden'}>${n > 99 ? '99+' : n}</span>`;
  $('#keptBtn').setAttribute('aria-label', n ? `Kept passages, ${n}` : 'Kept passages');
}
const appUrl = () => location.origin + location.pathname;
async function share(text, source) {
  const body = `“${text}”\n— Śrīla Prabhupāda, ${source}`;
  try { if (navigator.share) { await navigator.share({ title: 'Vani', text: body + '\n', url: appUrl() }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }

/* ---------- Sound: a tanpura drone and small bells, all made on the phone ---------- */
const Drone = (() => {
  let ctx = null, out = null, wet = null, timer = 0, next = 0, step = 0, on = false, ducked = false, waves = null;
  const SA = 138.59;   // C sharp
  const STRINGS = [SA * 0.75, SA, SA, SA / 2];
  function init() {
    if (ctx) return true;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return false; }
    out = ctx.createGain(); out.gain.value = 0;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = 0.4;
    const verb = ctx.createConvolver(); verb.buffer = impulse(3.2);
    wet = ctx.createGain(); wet.gain.value = 0.5;
    out.connect(lp); lp.connect(ctx.destination); lp.connect(verb); verb.connect(wet); wet.connect(ctx.destination);
    const mk = (tilt, buzz) => {
      const n = 40, re = new Float32Array(n), im = new Float32Array(n);
      for (let k = 1; k < n; k++) im[k] = Math.pow(k, -tilt) * (1 + buzz * Math.exp(-Math.pow((k - 11) / 5, 2)));
      return ctx.createPeriodicWave(re, im);
    };
    waves = { soft: mk(1.15, 0.6), bright: mk(0.55, 2.4) };
    return true;
  }
  function impulse(sec) {
    const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    return b;
  }
  function pluck(f, t) {
    const g1 = ctx.createGain(), g2 = ctx.createGain();
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    o1.setPeriodicWave(waves.soft); o2.setPeriodicWave(waves.bright);
    o1.frequency.value = f; o2.frequency.value = f; o2.detune.value = 3;
    g1.gain.setValueAtTime(0.0001, t); g1.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g1.gain.exponentialRampToValueAtTime(0.0001, t + 7);
    g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.09, t + 0.7); g2.gain.exponentialRampToValueAtTime(0.0001, t + 6.2);
    o1.connect(g1); o2.connect(g2); g1.connect(out); g2.connect(out);
    o1.start(t); o2.start(t); o1.stop(t + 7.2); o2.stop(t + 7.2);
  }
  function tick() {
    while (next < ctx.currentTime + 0.25) {
      pluck(STRINGS[step % 4], next);
      next += step % 4 === 3 ? 1.75 : 1.15;
      step++;
    }
  }
  function level() { return on && !ducked ? 0.16 : 0; }
  function apply(fade) {
    if (!ctx) return;
    const now = ctx.currentTime;
    out.gain.cancelScheduledValues(now);
    out.gain.setValueAtTime(out.gain.value, now);
    out.gain.linearRampToValueAtTime(level(), now + fade);
    if (level() > 0 && !timer) { next = Math.max(next, now + 0.05); timer = setInterval(tick, 60); tick(); }
    if (level() === 0 && timer) setTimeout(() => { if (level() === 0) { clearInterval(timer); timer = 0; } }, fade * 1000 + 50);
  }
  return {
    start() { if (!init()) return; ctx.resume().catch(() => {}); on = true; apply(3.5); },
    stop() { on = false; apply(1.2); },
    duck(d) { ducked = d; apply(d ? 0.8 : 2.5); },
    resume() { if (ctx && on) ctx.resume().catch(() => {}); },
    suspend() { if (ctx) ctx.suspend().catch(() => {}); },
    ctx() { return init() ? ctx : null; },
    dest() { return wet; },
  };
})();
function chime(kind) {
  if (!S.set.chimes) return;
  const ctx = Drone.ctx();
  if (!ctx) return;
  ctx.resume().catch(() => {});
  const t = ctx.currentTime + 0.01, g = ctx.createGain();
  g.connect(ctx.destination);
  if (Drone.dest()) g.connect(Drone.dest());
  if (kind === 'paper') {
    const len = Math.floor(ctx.sampleRate * 0.45), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(Math.sin(Math.PI * i / len), 2) * (0.6 + 0.4 * Math.sin(i / 90));
    const src = ctx.createBufferSource(); src.buffer = b;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.7;
    g.gain.value = 0.12; src.connect(bp); bp.connect(g); src.start(t);
    return;
  }
  // a small manjira bell: a few inharmonic partials
  [[1, 1], [2.32, 0.5], [4.25, 0.28], [6.63, 0.16]].forEach(([r, a]) => {
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.frequency.value = 1760 * r; o.type = 'sine';
    og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.05 * a, t + 0.006); og.gain.exponentialRampToValueAtTime(0.0001, t + 1.6 / Math.sqrt(r));
    o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.8);
  });
  g.gain.value = 1;
}

/* ---------- The sky: first light rising as you read ---------- */
const Sky = (() => {
  const cv = $('#sky'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, motes = [], col = {}, raf = 0, last = 0, tilt = { x: 0, y: 0, tx: 0, ty: 0 }, rise = 0, riseT = 0;
  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const n = Math.round(Math.min(60, (W * H) / 9000));
    motes = Array.from({ length: n }, (_, i) => mote(true, i));
    draw(performance.now());
  }
  function mote(anywhere) {
    const z = Math.random();
    return { x: Math.random() * W, y: anywhere ? Math.random() * H : H + 10, z, r: 0.5 + z * 1.6, vy: 4 + z * 10, ph: Math.random() * 6.28, tw: 0.4 + Math.random() * 1.2 };
  }
  function colours() {
    const cs = getComputedStyle(document.documentElement), v = (n) => cs.getPropertyValue(n).trim();
    col = { bg: v('--bg'), a: v('--glow-a'), b: v('--glow-b'), c: v('--glow-c'), sun: v('--sun'), ink: v('--ink') };
    draw(performance.now());
  }
  const rgba = (hex, a) => { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.replace(/./g, '$&$&') : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  function draw(t) {
    if (!col.bg) return;
    const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
    rise += (riseT - rise) * Math.min(1, dt * 3 || 1);
    tilt.x += (tilt.tx - tilt.x) * 0.06; tilt.y += (tilt.ty - tilt.y) * 0.06;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = col.bg; ctx.fillRect(0, 0, W, H);
    // night colour high up, first light low down; it climbs as the page is read
    const cy = H * (1.12 - rise * 0.5), R = Math.max(W, H) * 0.95;
    let g = ctx.createRadialGradient(W * 0.5 + tilt.x * 0.6, cy, 0, W * 0.5, cy, R);
    g.addColorStop(0, rgba(col.a, 0.30 + rise * 0.08)); g.addColorStop(0.32, rgba(col.b, 0.16)); g.addColorStop(0.7, rgba(col.c, 0.10)); g.addColorStop(1, rgba(col.c, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    g.addColorStop(0, rgba(col.bg, 0.9)); g.addColorStop(1, rgba(col.bg, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.5);
    for (const m of motes) {
      if (!reduced.matches) {
        m.y -= m.vy * dt; m.x += Math.sin(t / 1000 * 0.4 + m.ph) * 0.12;
        if (m.y < -10) Object.assign(m, mote(false));
      }
      const a = (0.25 + 0.55 * m.z) * (0.55 + 0.45 * Math.sin(t / 1000 * m.tw + m.ph)) * Math.min(1, (H - m.y) / (H * 0.15) + 0.2);
      const px = m.x + tilt.x * (0.3 + m.z), py = m.y + tilt.y * (0.3 + m.z);
      ctx.fillStyle = rgba(m.z > 0.6 ? col.sun : col.ink, Math.max(0, a) * 0.7);
      ctx.beginPath(); ctx.arc(px, py, m.r, 0, 6.283); ctx.fill();
    }
  }
  let skip = false;
  function loop(t) {
    raf = requestAnimationFrame(loop);
    skip = !skip; if (skip) return;   // about 30 frames a second is plenty, and kinder to the battery
    draw(t);
  }
  function start() { if (!raf && !reduced.matches) raf = requestAnimationFrame(loop); }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function scroll() {
    const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    riseT = Math.min(1, scrollY / max);
    if (!raf) draw(performance.now());
  }
  function orient(e) {
    if (typeof e.beta !== 'number' || typeof e.gamma !== 'number') return;
    tilt.tx = Math.max(-1, Math.min(1, e.gamma / 30)) * 14;
    tilt.ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30)) * 10;
  }
  async function motion(fromTap) {
    if (reduced.matches || typeof DeviceOrientationEvent === 'undefined') return;
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      if (!fromTap) return;
      try { if ((await DeviceOrientationEvent.requestPermission()) !== 'granted') return; } catch { return; }
    }
    window.addEventListener('deviceorientation', orient);
  }
  addEventListener('resize', () => { if (Math.abs(innerWidth - W) > 40 || Math.abs(innerHeight - H) > 160) size(); });
  addEventListener('scroll', scroll, { passive: true });
  return { size, colours, start, stop, motion, scroll };
})();

/* ---------- Gestures: swipe right closes the reader, drag a sheet down to close it ---------- */
(function gestures() {
  let g = null;
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0], el = e.target;
    const reader = !$('#reader').hidden && el.closest('#reader');
    const drag = el.closest('[data-drag="sheet"]') && sheet.open;
    if (!reader && !drag) return;
    if (el.closest('input, textarea') || (getSelection && String(getSelection()).length)) return;
    if (reader && !standalone && t.clientX < 24) return;   // leave the edge to the browser's own Back
    g = { x0: t.clientX, y0: t.clientY, dir: null, kind: drag ? 'sheet' : 'reader', el: drag ? sheet : $('#reader'), t0: performance.now(), d: 0 };
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!g) return;
    const t = e.touches[0], dx = t.clientX - g.x0, dy = t.clientY - g.y0;
    if (!g.dir) {
      if (Math.hypot(dx, dy) < 10) return;
      g.dir = g.kind === 'sheet' ? (dy > 0 && Math.abs(dy) > Math.abs(dx) ? 'down' : 'none') : (dx > 0 && Math.abs(dx) > Math.abs(dy) * 1.3 ? 'right' : 'none');
      if (g.dir === 'none') { g = null; return; }
    }
    e.preventDefault();
    g.d = g.dir === 'down' ? Math.max(0, dy) : Math.max(0, dx);
    if (!reduced.matches) { g.el.style.transition = 'none'; g.el.style.transform = g.dir === 'down' ? `translateY(${g.d}px)` : `translateX(${g.d}px)`; }
  }, { passive: false });
  document.addEventListener('touchend', () => {
    if (!g || !g.dir) { g = null; return; }
    const size = g.dir === 'down' ? g.el.offsetHeight / 4 : innerWidth / 3;
    const fast = g.d / Math.max(1, performance.now() - g.t0) > 0.5;
    const el = g.el, kind = g.kind;
    el.style.transition = '';
    if (g.d > size || (fast && g.d > 40)) {
      if (!reduced.matches) el.style.transform = g.dir === 'down' ? 'translateY(100%)' : 'translateX(100%)';
      const done = () => { el.style.transform = ''; };
      if (kind === 'sheet') { setTimeout(() => { closeSheet(); setTimeout(done, 60); }, reduced.matches ? 0 : 160); }
      else { setTimeout(() => { popLayer('reader'); setTimeout(done, 400); }, reduced.matches ? 0 : 160); }
    } else el.style.transform = '';
    g = null;
  });
})();

  }
  if (d.item) {
    const it = S.day.items.find((x) => x.id === d.item);
    closeSheet();
    if (it) { S.feat = { it, ex: null }; chooseFeatured(null, it); document.getElementById('today').scrollIntoView({ block: 'start' }); }
    return;
  }
  if (d.read) { openReader(d.read, null); return; }
  if (d.seek != null && d.seek !== undefined && t.classList.contains('tm')) {
    if (S.player.item && readerFor && S.player.item.id === readerFor.id) { voice.currentTime = +d.seek; if (voice.paused) voice.play().catch(playFailed); }
    else if (readerFor) { const it = infoFor(readerFor.id); if (it && it.audio) { const doc = await getDoc(it.id); await hear(it, doc, null); const go = () => { voice.currentTime = +d.seek; }; if (voice.readyState >= 1) go(); else voice.addEventListener('loadedmetadata', go, { once: true }); } }
    return;
  }
  if (d.keepVerse) { const v = findVerse(d.keepVerse); if (v) toggleKeep(verseEntry(v.id, v.v), t); return; }
  if (d.shareVerse) { const v = findVerse(d.shareVerse); if (v) { const ref = V.bookRef(v.id, v.v.title); share(V.plainSmart(v.v.translation), `${ref.name} ${ref.ref}`); } return; }
  if (d.unkeep) { S.kept = S.kept.filter((x) => x.k !== d.unkeep); put('kept', S.kept); updateBadge(); openKept(); return; }
  if (d.openKept) { const x = S.kept.find((k) => k.k === d.openKept); if (x) closeSheet(() => openReader(x.id, x.block)); return; }
  if (d.dismiss) { const x = get('dismissed', {}); x[d.dismiss] = 1; put('dismissed', x); renderToday(); return; }
  if (d.size) { S.set.size = d.size; saveSet(); applySize(); document.querySelectorAll('[data-size]').forEach((c) => c.setAttribute('aria-pressed', String(c === t))); return; }

  switch (d.act) {
    case 'prev-day': case 'next-day': moveDay(d.act === 'prev-day' ? -1 : 1); break;
    case 'to-today': S.date = noon(new Date()); loadDay(); break;
    case 'day-list': openDayList(); break;
    case 'read-feat': if (S.feat && S.feat.ex) openReader(S.feat.it.id, S.feat.ex.block); break;
    case 'keep-feat': if (S.feat && S.feat.ex) { const f = S.feat; toggleKeep({ k: keyFor(f.it.id, f.ex.block), id: f.it.id, kind: f.it.kind, title: f.it.title, sub: f.it.kind === 'letters' ? V.longDate(f.it.id) : `${f.it.place ? f.it.place + ', ' : ''}${f.it.year}`, text: V.smart(f.ex.text), block: f.ex.block }, t); } break;
    case 'share-feat': if (S.feat && S.feat.ex) share(V.smart(S.feat.ex.text), featSource(S.feat.it)); break;
    case 'hear': if (S.feat) hear(S.feat.it, S.feat.doc, S.feat.doc ? S.feat.ex : null, !!S.feat.doc); break;
    case 'hear-reader': if (readerFor) { const it = infoFor(readerFor.id); if (it) { const doc = await getDoc(it.id); const same = S.feat && S.feat.it.id === it.id; hear(it, doc, same ? S.feat.ex : null, false); } } break;
    case 'share-reader': {
      if (!readerFor) break;
      const id = readerFor.id, k = V.kindOf(id);
      if (k === 'books') { const doc = await getDoc(id); const v = V.verse(doc); const ref = V.bookRef(id, v.title); share(V.plainSmart(v.translation), `${ref.name} ${ref.ref}`); }
      else { const it = infoFor(id); const doc = await getDoc(id); const ex = (S.feat && S.feat.it.id === id && S.feat.ex) || V.extract(doc, k) || firstWords(doc, k); if (ex && it) share(V.smart(ex.text), featSource(it)); }
      break;
    }
    case 'close-reader': popLayer('reader'); break;
    case 'close-sheet': closeSheet(); break;
    case 'open-book': openBook(); break;
    case 'retry': if (S.books) chooseFeatured(); else location.reload(); break;
    case 'retry-verse': if (S.books) loadVerse(); else location.reload(); break;
    case 'last': { const l = get('last', null); if (l) { S.feat = { it: l.it, doc: null, ex: { raw: l.raw, text: l.text, block: l.block, score: 0, ok: true } }; S.featState = 'ready'; S.offlineNote = 'Offline. This is from your last visit.'; renderToday(); } break; }
    case 'sound':
      S.set.sound = !S.set.sound; saveSet(); setSoundBtn();
      t.setAttribute('aria-checked', String(S.set.sound));
      if (S.set.sound) Drone.start(); else Drone.stop();
      break;
    case 'chimes': S.set.chimes = !S.set.chimes; saveSet(); t.setAttribute('aria-checked', String(S.set.chimes)); if (S.set.chimes) chime('bell'); break;
    case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; renderToday(); } break;
    case 'welcome-again': closeSheet(showWelcome); break;
  }
});
$('#soundBtn').addEventListener('click', () => {
  S.set.sound = !S.set.sound; saveSet(); setSoundBtn();
  if (S.set.sound) { Drone.start(); toast('Tanpura on'); } else { Drone.stop(); toast('Tanpura off'); }
});
$('#keptBtn').addEventListener('click', openKept);
$('#settingsBtn').addEventListener('click', openSettings);
$('#themeBtn').addEventListener('click', () => togglePop('themes'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && popOpen()) { closePops(); $('#themeBtn').focus(); } });

function applySize() { if (S.set.size === 'large') document.documentElement.dataset.size = 'large'; else delete document.documentElement.dataset.size; }

function moveDay(n) {
  const d = new Date(S.date); d.setDate(d.getDate() + n);
  S.date = noon(d);
  loadDay();
}
function loadDay() {
  S.offlineNote = '';
  setDay();
  S.feat = null;
  chooseFeatured();
  loadVerse();
  renderVerse();
  prefetchSoon();
}

// Tomorrow's words are read ahead quietly, so tomorrow opens even without a connection
function prefetchSoon() {
  const go = async () => {
    if (!isToday() || !S.index) return;
    const tm = noon(new Date(Date.now() + 864e5));
    const items = V.dayItems(S.index, V.mmdd(tm)).items;
    for (const it of V.featuredOrder(items, V.ymd(tm)).slice(0, 2)) await getText(it.id).catch(() => {});
    await getText(V.verseOfDay(S.books.bg, tm)).catch(() => {});
  };
  (window.requestIdleCallback || ((f) => setTimeout(f, 4000)))(() => go(), { timeout: 8000 });
}

/* ---------- Install ---------- */
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; if (S.welcomed) renderToday(); const w = $('#welcome'); if (!w.hidden && !w.classList.contains('gone')) { const keep = $('#code') && $('#code').value; showWelcome(); if (keep) $('#code').value = keep; } });

/* ---------- Coming back ---------- */
let lastDay = V.ymd(new Date());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    Sky.start(); Drone.resume();
    const now = V.ymd(new Date());
    if (now !== lastDay) { lastDay = now; if (S.index) { S.date = noon(new Date()); loadDay(); } }
  } else { Sky.stop(); if (voice.paused) Drone.suspend(); savePos(); }
});

/* ---------- Footer ---------- */
$('#foot').innerHTML = `<p>Śrīla Prabhupāda’s words, read live from the vani.wiki archive of his original books, lectures and letters.</p>
  <p>His words © The Bhaktivedanta Book Trust. <a href="https://github.com/vaniwiki" target="_blank" rel="noopener">The archive</a></p>`;

/* ---------- Start ---------- */
(async function start() {
  // a shared link can carry the code: …/Vani/#k=1234
  const m = /[#&]k=([^&]+)/.exec(location.hash);
  if (m) {
    history.replaceState(null, '', location.pathname + location.search);
    try { if ((await sha('vani:' + decodeURIComponent(m[1]))) === CODE_HASH) { S.unlocked = true; put('unlocked', true); } } catch {}
  }
  history.replaceState({ vani: 'home' }, '');
  setTheme(S.set.theme);
  applySize();
  setSoundBtn();
  updateBadge();
  $('#themeBtn').innerHTML = ICON.eye; $('#settingsBtn').innerHTML = ICON.sliders;
  $('#nearBtn').innerHTML = ICON.near; $('#dockX').innerHTML = ICON.x; $('#ppBtn').innerHTML = ICON.play;
  Sky.size(); Sky.start(); Sky.scroll();
  if (!S.unlocked || !S.welcomed) showWelcome();
  else { document.body.classList.remove('locked'); armSound(); Sky.motion(false); }
  renderToday(); renderVerse(); renderBook();
  try { await loadIndex(); }
  catch { S.featState = 'offline'; S.verseState = 'offline'; S.index = { days: {}, types: [], places: [] }; S.day = { items: [], years: [] }; renderToday(); renderVerse(); return; }
  loadDay();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
</body>
